# XcodeGen spec for the Later iPhone app. The .xcodeproj is generated from this file and never
# committed: `xcodegen generate --spec ios/project.yml` (ios/scripts/macos-ci.sh pins the version).
name: Later
options:
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
# The xcconfigs are attached to each TARGET as well as the project: XcodeGen's project-level
# presets (SWIFT_VERSION 5.0 among them) outrank a project xcconfig, but a target xcconfig
# outranks them. Its platform preset (TARGETED_DEVICE_FAMILY "1,2") is target-level, so that one
# key is restated per target below.
configFiles: &configFiles
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.6
  LaterKit:
    path: LaterKit
targets:
  Later:
    type: application
    configFiles: *configFiles
    platform: iOS
    sources:
      - path: LaterApp
        excludes:
          - Info.plist
          - Later.entitlements
    info:
      path: LaterApp/Info.plist
      properties:
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        LATER_API_BASE_URL: $(LATER_API_BASE_URL)
        LATER_APP_GROUP: $(LATER_APP_GROUP)
        LATER_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)now.notfor.later.shared
        LATER_CODE_SIGNING_ALLOWED: $(CODE_SIGNING_ALLOWED)
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: Later
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: '6.0'
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
        - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
          CFBundleURLSchemes:
          - $(LATER_URL_SCHEME)
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        BGTaskSchedulerPermittedIdentifiers:
        - now.notfor.later.prepare-narration
        UIBackgroundModes:
        - processing
        - audio
    dependencies:
      - target: LaterShare
        embed: true
      - package: LaterKit
      - package: Supabase
        product: Auth
    preBuildScripts:
      - name: Validate sign-in configuration
        script: |
          /usr/bin/python3 "$SRCROOT/Config/validate-auth-config.py"
          /usr/bin/python3 "$SRCROOT/Config/validate-auth-config.py" --test
        basedOnDependencyAnalysis: false
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: LaterApp/Later.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: Later
        PRODUCT_MODULE_NAME: Later
        PRODUCT_BUNDLE_IDENTIFIER: $(LATER_BUNDLE_ID)
        INFOPLIST_FILE: LaterApp/Info.plist
  LaterShare:
    type: app-extension
    configFiles: *configFiles
    platform: iOS
    sources:
      - path: LaterShare
        excludes:
          - Info.plist
          - LaterShare.entitlements
      - LaterApp/Theme
      - LaterApp/Services/Auth/AppAuthConfiguration.swift
      - LaterApp/Services/Auth/KeychainSessionStorage.swift
      - LaterApp/Services/Capture/CaptureFileOutbox.swift
    dependencies:
      - package: LaterKit
      - package: Supabase
        product: Auth
    info:
      path: LaterShare/Info.plist
      properties:
        CFBundleDisplayName: Later
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        LATER_API_BASE_URL: $(LATER_API_BASE_URL)
        LATER_APP_GROUP: $(LATER_APP_GROUP)
        LATER_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)now.notfor.later.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: LaterShare/LaterShare.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(LATER_SHARE_BUNDLE_ID)
        PRODUCT_MODULE_NAME: LaterShare
        SKIP_INSTALL: YES
  LaterAppTests:
    type: bundle.unit-test
    configFiles: *configFiles
    platform: iOS
    sources:
      - LaterAppTests
    dependencies:
      - target: Later
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(LATER_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Later.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Later
        BUNDLE_LOADER: $(TEST_HOST)
  LaterShareTests:
    type: bundle.unit-test
    configFiles: *configFiles
    platform: iOS
    sources:
      - LaterShareTests
      - path: LaterShare
        excludes:
          - Info.plist
          - LaterShare.entitlements
      - LaterApp/Theme
      - LaterApp/Services/Auth/AppAuthConfiguration.swift
      - LaterApp/Services/Auth/KeychainSessionStorage.swift
      - LaterApp/Services/Capture/CaptureFileOutbox.swift
    dependencies:
      # Package symbols come from the host, as for LaterAppTests. Linking the same
      # static products in both the host and its test bundle is unnecessary.
      - target: Later
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(LATER_BUNDLE_ID).sharetests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Later.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Later
        BUNDLE_LOADER: $(TEST_HOST)
  LaterAppUITests:
    type: bundle.ui-testing
    configFiles: *configFiles
    platform: iOS
    sources:
      - LaterAppUITests
    dependencies:
      - target: Later
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(LATER_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Later
schemes:
  Later:
    build:
      targets:
        Later: all
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - LaterShareTests
        - Later
      targets:
        - LaterAppTests
        - LaterShareTests
        - LaterAppUITests
