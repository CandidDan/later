name: flow-unblock

# Thin caller — the blocked-task release sweep (flow-0041) lives in canonical (CandidDan/flow) as a
# reusable workflow, adopted here by reference. See docs/flow-reusable-workflows.md in the flow repo.
#
# Releases every `blocked` task whose `blocked_by` entries have ALL resolved (a task `done` on
# main, a PR merged) back to `ready`, and stops there: it starts no worker (flow-0173) — the next
# worker run, on the worker routine's own schedule, picks the released task. No model in the
# loop. A block with no machine-readable `blocked_by` entry is never released — only a human may
# lift it.
#
# Two triggers, one job: flow-done completing, and on demand. No schedule (flow-0185): a
# `blocked_by` entry resolves only when a task reaches `done` or a PR merges, which is flow-done
# completing; an hourly backstop cost about 720 billed Actions minutes a month in an idle repo. A
# block written after its dependency already landed waits for the next flow-done run, or a
# workflow_dispatch. After a release is pushed, the reusable sends repository_dispatch
# `flow-task-state`, which starts flow-dispatch.
# NOT gated on FLOW_AI: a repo worked entirely by humans still has blocks whose dependencies land.
# No secrets — the reusable uses GITHUB_TOKEN only. The reusable still declares an ignored
# `queue_runner_workflow` input (the retired queue-runner) so an older caller passing it keeps working.

on:
  workflow_run:
    workflows: [flow-done]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: flow-unblock
  cancel-in-progress: false

jobs:
  flow-unblock:
    permissions:
      contents: write          # the release commit to main
      pull-requests: read      # the blocked_by PR lookup, so a PR-url block releases on merge
    uses: CandidDan/flow/.github/workflows/_flow-unblock.yml@v4
    with:
      runner: ${{ vars.FLOW_RUNNER || 'ubuntu-latest' }}
