name: flow-recover

# Thin caller — the stranded-task self-heal sweep (CAN-51) lives in canonical (CandidDan/flow)
# as a reusable workflow, adopted here by reference. This caller owns the schedule + the
# workflow_dispatch input (forwarded with `with: threshold_minutes`), and passes FLOW_PAT by
# name (CAN-58), not `secrets: inherit`: this job has no use for CLAUDE_CODE_OAUTH_TOKEN and
# should not carry it. See docs/flow-reusable-workflows.md in the flow repo.
#
# DORMANT until repo variable FLOW_AI=true (no autonomous workers, nothing to strand); always
# runnable on demand via workflow_dispatch. A reset with nothing pushed also moves the task up one
# model tier (flow-0174).
#
# Once a day (flow-0185), not every 3 hours: a stranded claim waits up to a day to be reset, and an
# idle repo bills 30 runs a month here instead of 240. The 75-minute threshold is unchanged. A sweep
# that pushes a task-file change sends repository_dispatch `flow-task-state`, which starts
# flow-dispatch; a sweep that changes nothing starts nothing.

on:
  schedule:
    - cron: "53 5 * * *"       # daily (flow-0185); the threshold (in the reusable) is the real gate
  workflow_dispatch:
    inputs:
      threshold_minutes:
        description: "Minutes of no movement before a task is considered stranded (default 75)."
        required: false
        type: string

concurrency:
  group: flow-recover
  cancel-in-progress: false

jobs:
  flow-recover:
    permissions:
      contents: write
      pull-requests: write
    uses: CandidDan/flow/.github/workflows/_flow-recover.yml@v4
    with:
      runner: ${{ vars.FLOW_RUNNER || 'ubuntu-latest' }}
      threshold_minutes: ${{ inputs.threshold_minutes }}
    secrets:
      FLOW_PAT: ${{ secrets.FLOW_PAT }}
