name: flow-status

# Thin caller — PR-event status sync lives in canonical (CandidDan/flow) as a reusable
# workflow, adopted here by reference. See docs/flow-reusable-workflows.md in the flow repo.

on:
  pull_request:
    # ready_for_review is flow-0039: flow-open-pr opens a DRAFT on the first push, so the
    # in_review transition belongs to the moment the worker marks it ready, not to the PR existing.
    types: [opened, reopened, ready_for_review, closed]
    branches: [main]

jobs:
  flow-status:
    permissions:
      contents: write
    uses: CandidDan/flow/.github/workflows/_flow-status.yml@v2
