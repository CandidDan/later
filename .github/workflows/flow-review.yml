name: flow-review

# Thin caller — the three Definition-of-Done review checks (qa, code-review, security) are
# authored once in canonical (CandidDan/flow) as a reusable workflow and adopted here by
# reference. This caller owns the pull_request trigger and passes CLAUDE_CODE_OAUTH_TOKEN by
# name — the only secret the reusable declares — rather than `secrets: inherit`, which would
# also hand this job FLOW_PAT it never uses. See docs/flow-reusable-workflows.md in the flow repo.
#
# These reviewers used to run as subagents inside the worker's own session. They run here now
# so the thing being reviewed and the thing reviewing it are no longer the same session
# (flow-0007). A worker no longer invokes any review subagent; the definition of done is
# certified only by these checks.
#
# The reviewer model and the paths that trigger the conditional security review are DATA, in
# this repo's .flow/config.yml under `review:` — tune them there, never by editing shared infra.
#
# DISABLED BY DEFAULT — gated on repo variable FLOW_AI=true, and needs the
# CLAUDE_CODE_OAUTH_TOKEN secret. Make these checks REQUIRED in branch protection once enabled;
# a blocking gate that nothing enforces is the failure mode the whole task exists to remove.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

jobs:
  flow-review:
    # id-token: write must be granted on the caller — OIDC is never in the default GITHUB_TOKEN,
    # and a reusable workflow can't raise it above the caller's grant. A permissions block is
    # exhaustive, so contents/pull-requests/issues are re-listed. See docs/flow-reusable-workflows.md.
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: CandidDan/flow-protocol/.github/workflows/_flow-review.yml@v1.2.0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
